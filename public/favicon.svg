<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A "G" drawn as a graph: nodes joined by edges, the last edge turning in as the crossbar. -->
  <rect width="32" height="32" rx="7" fill="#3454d1" />
  <path
    d="M23.5 9 L16 6.5 L8.5 9.5 L6.5 17 L10 23.5 L17 26 L24 22.5 L25 17.5 L18 17.5"
    fill="none"
    stroke="#fdfdfc"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <g fill="#fdfdfc">
    <circle cx="23.5" cy="9" r="2.3" />
    <circle cx="8.5" cy="9.5" r="2.3" />
    <circle cx="10" cy="23.5" r="2.3" />
    <circle cx="24" cy="22.5" r="2.3" />
    <circle cx="18" cy="17.5" r="2.3" />
  </g>
</svg>
